[project]
name = "chips-skills"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Fábio Macêdo Mendes", email = "fabiomacedomendes@gmail.com" },
]
requires-python = ">=3.13"
dependencies = [
    "rich>=15.0.0",
    "typer>=0.27.1",
]

[project.scripts]
chips-skills = "chips_skills.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-coverage>=0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"
