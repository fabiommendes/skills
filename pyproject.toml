[project]
name = "chips-skills"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Fábio Macêdo Mendes", email = "fabiomacedomendes@gmail.com" },
]
requires-python = ">=3.13"
dependencies = [
    "rich>=15.0.0",
    "typer>=0.27.1",
]

[project.scripts]
chips-skills = "chips_skills.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "taskipy>=1.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"

[tool.ruff]
line-length = 88
extend-exclude = [".claude", "src/chips_skills/skills"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
files = ["src"]
strict = true

[tool.taskipy.tasks]
test = "pytest --cov=chips_skills --cov-report=term-missing"
lint = "ruff check . && ruff format --check ."
typecheck = "mypy"
ci = "task lint && task typecheck && task test"
release = "task ci && uv build"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"
